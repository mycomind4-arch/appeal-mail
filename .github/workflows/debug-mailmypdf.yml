name: Debug MailMyPDF Worker
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Tail worker logs for 6 minutes
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          npx wrangler tail mailmypdf --format json > tail.log 2>&1 &
          TAIL_PID=$!
          sleep 360
          kill $TAIL_PID || true
          echo "===== TAIL LOG ====="
          cat tail.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
