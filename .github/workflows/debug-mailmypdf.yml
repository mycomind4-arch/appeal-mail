name: Debug MailMyPDF Worker
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect worker secrets
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          cat > wrangler.json << 'EOF2'
          { "name": "mailmypdf", "compatibility_date": "2026-01-01", "main": "index.js" }
          EOF2
          echo "export {}" > index.js
          npx wrangler secret list --config wrangler.json || true
          npx wrangler deployment list --config wrangler.json || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Tail worker logs during signed webhook probe
        run: |
          set -euo pipefail
          cd work
          npx wrangler tail --format json > tail.log 2>&1 &
          TAIL_PID=$!
          sleep 15
          python3 << 'PYEOF'
          import hashlib, hmac, json, time, urllib.request, os
          whsec = os.environ["PAYMENTS_SANDBOX_WEBHOOK_SECRET"]
          payload = json.dumps({"id": "evt_debug_probe", "type": "checkout.session.completed",
              "data": {"object": {"id": "cs_test_probe"}}})
          t = str(int(time.time()))
          sig = hmac.new(whsec.encode(), f"{t}.{payload}".encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              "https://mailmypdf.mycomind4.workers.dev/api/public/payments/webhook",
              data=payload.encode(),
              headers={"Content-Type": "application/json", "Stripe-Signature": f"t={t},v1={sig}"})
          try:
              with urllib.request.urlopen(req) as r:
                  print("probe HTTP", r.status, r.read().decode()[:200])
          except urllib.error.HTTPError as e:
              print("probe HTTP", e.code, e.read().decode()[:200])
          PYEOF
          sleep 15
          kill $TAIL_PID || true
          echo "===== TAIL LOG ====="
          cat tail.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYMENTS_SANDBOX_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_SANDBOX_WEBHOOK_SECRET }}
