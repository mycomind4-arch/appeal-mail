name: Deploy MailMyPDF Host
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mycomind4-arch/mailmypdf-all
          ref: main
          path: mailmypdf-all
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mailmypdf-all/pnpm-lock.yaml
      - name: Install workspace
        working-directory: mailmypdf-all
        run: pnpm install --no-frozen-lockfile
      - name: Deploy host app to Cloudflare Workers
        working-directory: mailmypdf-all/mailmypdf
        run: |
          set -euo pipefail
          npm run build
          cd .output/server
          python3 << 'PYEOF'
          import json
          with open("wrangler.json") as f:
              config = json.load(f)
          config["name"] = "mailmypdf"
          config["triggers"] = {"crons": ["*/5 * * * *"]}
          with open("wrangler.json", "w") as f:
              json.dump(config, f, indent=2)
          PYEOF
          npx wrangler deploy --config wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
